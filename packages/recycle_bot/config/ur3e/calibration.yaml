# Calibration config for rec_bot_core — UR3e cell.
# Camera transform and detection filtering parameters.
#
# ############################################################################
# # TRANSLATION MEASURED 2026-08-18. ROTATION IS STILL UNVERIFIED.           #
# ############################################################################

# camera transform: static transform from base_link to camera_link (meters)
# used for projecting detections into the robot frame.
#
# How the translation was obtained: the bare flange was pressed up against the
# underside of the camera and the controller's TCP read directly. The PolyScope
# TCP offset is zero, so the reported pose is the flange face, and the flange
# frame origin lies on that face — the contact point is the reading.
#
#   camera underside (base_link) = [0.16646, 0.01297, 0.54795]
#
# camera_link sits inside the housing rather than on its underside, so 12 mm is
# added in z (about half the D415's 23 mm body height) to reach the middle of the
# case. That 12 mm is an ESTIMATE, not a measurement, and it is the largest known
# error in this transform.
#
# NOTE the frame: parent is base_link (REP-103, X+ forward / Y+ left / Z+ up),
# NOT the UR "base" frame that sorting_sequence.yaml uses. Mixing them up flips
# the x/y signs and mirrors every detection through the robot's origin. The
# numbers below are already in base_link.
#
# ROTATION IS NOT MEASURED. Touch points give position only — they say nothing
# about how the camera is aimed. The quaternion below is carried over unchanged
# from the UR16e cell and encodes a camera looking straight down in the usual
# optical-frame convention. Verify it before trusting any detection: put a known
# object under the camera, compare what /vision/detected_object reports against
# where the flange actually touches that object, and adjust. A rotation error
# shows up as a detection offset that GROWS with distance from the image centre,
# which is how to tell it apart from a translation error (constant offset).
camera_transform:
  parent_frame: "base_link"
  child_frame: "camera_link"
  translation: [0.16646, 0.01297, 0.55995]  # measured underside + 12 mm in z
  rotation: [-0.5, 0.5, 0.5, 0.5]   # TODO(ur3e-cell): UNVERIFIED — see above

# detection filter thresholds
# RealSense D415 range: 0.3 m - 10 m (optimal 0.5 m - 3 m)
detection_filter:
  min_confidence: 0.75  # matched to the UR16e cell; this is a property of the
                        # YOLO model, not the arm, so keep the two in sync

  # Depth window, derived from the measured camera height.
  #
  # Camera underside is at z = 0.548 and the table top at z = 0.002, so the
  # camera looks down 0.546 m onto the table.
  #
  # max 0.62 m: the table surface sits at ~0.55 m plus a little slack for an
  #   uneven surface. Anything beyond that is past the table — the floor, or
  #   somebody walking by — and cannot be a pickable object.
  # min 0.30 m: allows objects up to ~0.25 m tall while staying at the D415's
  #   rated close range. Anything nearer is the arm itself passing through frame.
  min_depth_m: 0.30
  max_depth_m: 0.62
