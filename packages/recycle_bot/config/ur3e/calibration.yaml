# Calibration config for rec_bot_core — UR3e cell.
# Camera transform and detection filtering parameters.
#
# ############################################################################
# # TODO(ur3e-cell): camera_transform is a PLACEHOLDER.                      #
# # Measure it with the UR3e tool tip and replace before running on hardware.#
# ############################################################################

# camera transform: static transform from base_link to camera_link (meters)
# used for projecting detections into the robot frame.
#
# Measurement procedure (same as the UR16e cell):
#   1. Jog the tool tip to a known point in the camera's view.
#   2. Read the TCP position off the teach pendant.
#   3. Solve for the camera pose that maps the detected pixel to that point.
#
# NOTE the frame: parent is base_link (REP-103, X+ forward / Y+ left / Z+ up),
# NOT the UR "base" frame that sorting_sequence.yaml uses. Mixing them up flips
# the x/y signs and mirrors every detection through the robot's origin.
#
# The rotation below is unchanged from the UR16e cell: it encodes a camera
# looking straight down with the usual optical-frame convention, which is a
# mounting choice, not an arm property. Re-derive it only if the UR3e camera is
# mounted at a different angle.
camera_transform:
  parent_frame: "base_link"
  child_frame: "camera_link"
  translation: [0.25, -0.20, 0.50]  # TODO(ur3e-cell): measure with UR3e tool tip
  rotation: [-0.5, 0.5, 0.5, 0.5]   # quaternion [x, y, z, w], camera looking down

# detection filter thresholds
# RealSense D415 range: 0.3 m - 10 m (optimal 0.5 m - 3 m)
detection_filter:
  min_confidence: 0.75  # matched to the UR16e cell; this is a property of the
                        # YOLO model, not the arm, so keep the two in sync

  # Depth window, tightened for the UR3e cell.
  #
  # This is the one filter value that genuinely must change with the arm. On the
  # UR16e the camera sits ~0.61 m up and the window is [0.1, 1.5] m. Here the
  # camera is ~0.50 m up, and anything the UR3e can actually reach lies within
  # ~0.45 m of the base — so a detection reported at 1.4 m is guaranteed to be
  # outside the workspace (a person walking past, the floor, the far wall).
  # Rejecting it here is much cheaper than letting rec_bot_control queue a task
  # that the reach check then has to throw away.
  min_depth_m: 0.1
  max_depth_m: 0.7   # TODO(ur3e-cell): retune once the camera height is measured
