# YAML defining sorting target locations and neutral pose — UR3e cell.
#
# ############################################################################
# # ALL POSES TAUGHT on the real cell: 2026-08-18, bins re-taught 2026-09-11 #
# ############################################################################
#
# Poses come from jogging the arm and computing tool0 by forward kinematics from
# the reported joint angles — NOT from the controller's reported TCP. PolyScope's
# TCP offset on this cell is zero, so the controller reports the flange, 150 mm
# short of the vacuum cup. See recycle_bot/read_tcp.py.
#
# The 150 mm offset itself was verified against a physical surface: with the cup
# resting on the table, FK put tool0 within 2.4 mm of the independently measured
# table height.
#
# rec_bot_control reach-checks every pose here at startup and refuses to run if
# any falls outside the envelope, so a pose copied from another cell cannot
# survive unnoticed.
#
# Reach budget (measured from the SHOULDER, at z = 0.15185, not from base_link):
#   max tool0 reach, sampled from the URDF   0.7318 m
#   planning reach (0.85 derate)             0.6220 m  <- what the check enforces
# The datasheet "reach" of 0.500 m is the horizontal working radius and is NOT
# this quantity; using it rejected poses the arm had physically achieved. See
# RobotProfile in robot_profile.py.
#
# PAYLOAD: the UR3e carries 3 kg, against the UR16e's 16 kg. That is comfortably
# above a vacuum-gripped bottle or food packet, but it is now the same order of
# magnitude as the gripper itself — check the E-Pick's own mass against the
# payload budget before adding any tooling.
#
# Poses are defined in reference to the UR "base" frame (the controller frame
# shown on the teach pendant — rec_bot_control publishes these with
# frame_id "base"):
# - position: cartesian coordinates (meters) - consistent with MoveIt
# - orientation: quaternion [x, y, z, w]
#
# NOTE: "base" is NOT "base_link"! On UR robots base = base_link rotated 180 deg
# about Z, so x/y signs flip between the two. Measure poses in "base" (e.g. via
# the teach pendant TCP display), or negate x/y if you measured in base_link.

# neutral pose: safe position above workspace for transit between pick and place
# robot moves here after gripping before moving to place location
#
# TAUGHT 2026-08-18. tool0 computed by forward kinematics from the taught joint
# angles below, then expressed in the UR "base" frame. It is NOT the controller's
# reported pose: PolyScope's TCP offset is zero, so the controller reports the
# flange, 150 mm short of the cup.
#
# 0.326 m from the shoulder, well inside the 0.622 m envelope.
#
# The orientation is not the canonical face-down [1, 0, 0, 0] used by the UR16e
# cell, and that is deliberate. The taught pose points the tool EXACTLY straight
# down (0.00 deg off vertical); it differs from [1, 0, 0, 0] only by 87.6 deg of
# yaw about that vertical axis. For a round vacuum cup yaw is meaningless, and
# keeping the taught value guarantees this exact orientation is reachable here —
# whereas substituting the canonical one would assert a wrist configuration
# nobody has checked.
neutral_pose:
  position: [-0.13105, -0.29855, 0.15330]
  orientation: [0.721629, 0.692280, 0.0, 0.0]  # tool straight down, yaw as taught

# joint-space neutral (preferred for safe, deterministic motion)
#
# Joint-space goals bypass IK entirely, so they are the safest way to define a
# transit pose on a small arm where many Cartesian goals are unreachable.
#
# TAUGHT 2026-08-18, read from the controller. Values are kept exactly as the
# arm reported them rather than normalised to the nearest right angle: UR joints
# range over +/-2 pi, so wrist_1 at +4.71239 (270 deg) is a different joint value
# from -1.57080 (-90 deg) even though the arm is in the same physical place, and
# planning to the one the arm is actually at avoids a needless full-turn wrist
# rotation on the first move.
neutral_joint_pose:
  shoulder_pan_joint: -1.57079
  shoulder_lift_joint: -1.57081
  elbow_joint: -1.57079
  wrist_1_joint: 4.71239
  wrist_2_joint: 1.57078
  wrist_3_joint: 1.61231

# joint-space pose under the camera (waypoint before descending to pick)
#
# TAUGHT 2026-08-18. Joint space, so no IK and no tool-offset ambiguity.
#
# For reference, this puts tool0 at [-0.23151, -0.08888, 0.10959] in the "base"
# frame: 0.108 m above the table, with the tool 0.16 deg off vertical.
#
# It is NOT under the camera: it sits 0.082 m from the camera axis (0.076 m short
# of it in base_link x). It was taught against the old camera position, which put
# the camera inside the arm's inner dead zone. The camera was re-measured on
# 2026-09-11 at [0.307, 0.058] in base_link (0.31 m from the base axis, outside
# the 0.20 m dead zone — see calibration.yaml), so this pose can now be re-taught
# directly beneath it.
#
# The arm does sit in the camera's view here, which is harmless: rec_bot_vision
# gates capture on /rec_bot/robot_busy, so no detection is taken while the robot
# is moving through this waypoint.
under_camera_pose:
  shoulder_pan_joint: -2.21774
  shoulder_lift_joint: -1.20586
  elbow_joint: -2.06701
  wrist_1_joint: 4.84644
  wrist_2_joint: 1.57036
  wrist_3_joint: 1.56463

# named drop-off bins
# each bin is a position (meters) + orientation quaternion [x, y, z, w] in the
# UR "base" frame (see note at the top of this file)
#
# RE-TAUGHT 2026-09-11 after the bins were moved. The 2026-08-18 positions (three
# bins behind the robot at base x = +0.32) no longer apply. Three physical bins
# now sit in a row along the table's side edge, roughly 100 mm apart:
#
#   bin 1  x=+0.178   general_waste   catch-all, also default_bin
#   bin 2  x=+0.071   gelber_sack     plastics + metal cans
#   bin 3  x=-0.021   glas_papier     glass + cardboard
#
# What was taught is the PRE-PLACE pose over each bin (tool0 at z ~ 0.196). The
# positions below are the RELEASE points, derived as the taught pose minus
# approach_height_m (0.05), so pre-place = position + approach_height_m lands
# back exactly on the taught pose. The release height itself was NOT jogged to:
# the bins are not in the collision model, so if the cup meets a bin rim on the
# Step 8 descent, raise z here (or re-teach) rather than trusting the planner.
#
# Taught joint angles (rad; pan, lift, elbow, w1, w2, w3) at each pre-place:
#   bin 1  [-0.83416, -2.12386, -0.63673, 4.33424, 1.56426, 0.73741]
#   bin 2  [-1.06516, -2.00132, -0.82573, 4.38478, 1.56363, 0.50691]
#   bin 3  [-1.28283, -1.94680, -0.90631, 4.41151, 1.56056, 0.28947]
#
# Positions are tool0 — the cup tip — computed by forward kinematics from those
# joint angles, NOT the controller's reported flange pose.
#
# All three sit 0.40-0.44 m from the shoulder, inside the 0.622 m envelope, and
# within 1 deg of vertical. They lie over the table's side edge (base_link
# y ~ +0.40), but ~0.14 m above its top, so the table box does not obstruct them.
#
# Orientations are the taught ones, not the canonical face-down [1, 0, 0, 0].
# They are tried FIRST when placing (see _build_place_pose_candidates): a taught
# orientation is known reachable at its own position, whereas a synthesised yaw
# is only a guess.
bins:
  general_waste: { position: [0.17847, -0.39420, 0.14652], orientation: [0.000379, 0.999994, -0.003244, -0.001468] }  # bin 1
  gelber_sack:   { position: [0.07106, -0.40251, 0.14595], orientation: [0.000614, 0.999972, 0.003972, -0.006300] }  # bin 2
  glas_papier:   { position: [-0.02120, -0.39860, 0.14591], orientation: [0.000720, 0.999967, 0.004490, -0.006671] }  # bin 3

# label-to-bin routing: maps a detected YOLO class label (from model.names) to a
# bin name defined under 'bins' above. Any label not listed here falls through
# to 'default_bin'.
#
# Rewritten for Minimuell.pt (9 classes). The previous routing was written for
# RecycleBotDIS3Obj_full.pt and shared none of these labels — under it, 7 of the
# 9 new classes fell silently through to general_waste.
#
# The 2026-09-11 retrain of Minimuell.pt adds a 10th class, 'unbekannt' (German
# for "unknown"). It is routed to general_waste explicitly: default_bin would
# send it there anyway, but an explicit rule keeps the routing test able to tell
# a deliberate catch-all from a label someone forgot.
#
# Grouped by German kerbside separation: the Gelber Sack takes plastics and metal
# packaging together, glass and paper are collected separately, and anything
# unrecognised is residual waste.
#
# LABELS ARE COPIED VERBATIM FROM model.names AND ARE NOT CONSISTENTLY SPELLED.
# Note that 'non-food_bottle_pet' uses a HYPHEN while 'non_food_can_metal' and
# 'non_food_packet_PE' use UNDERSCORES, and that PE is uppercase. Matching is
# exact string comparison, so 'correcting' any of these to a consistent style
# silently sends that class to default_bin with no error.
bin_routing:
  # --- Gelber Sack: plastics ---
  food_bottle_pet: gelber_sack
  non-food_bottle_pet: gelber_sack
  food_packet_pp: gelber_sack
  food_packet_ps: gelber_sack
  non_food_packet_PE: gelber_sack
  # --- Gelber Sack: metal packaging ---
  food_can_metal: gelber_sack
  non_food_can_metal: gelber_sack
  # --- glass and paper ---
  food_jar_glass: glas_papier
  food_packet_cardboard: glas_papier
  # --- residual waste ---
  unbekannt: general_waste

# bin used for any detected label without a bin_routing entry
default_bin: general_waste

approach_height_m: 0.05  # meters above pick/place for approach/retreat
place_transit_height_m: 0.05  # optional higher Step 7 fallback height; keep equal to approach height unless a taller above-bin waypoint is known to be reachable
place_yaw_candidates_deg: [90.0, -90.0, 180.0, 0.0]  # Step 7/8 may rotate wrist yaw while keeping the tool vertical, avoiding unreachable exact-quaternion place goals
grasped_object_size: [0.05, 0.05, 0.05]  # meters (box attached to tool for planning)

# Inner dead-zone radius (meters), measured horizontally from the base axis.
# 0.0 disables the check.
#
# A UR arm cannot fold tightly enough to reach straight down close to its own
# base, so there is a cylinder around the base axis it simply cannot service.
# An outer-radius check cannot express this: a pose in the dead zone is CLOSE to
# the shoulder, so it passes every distance test while being unreachable.
#
# This matters on this cell specifically. The camera sits 0.31 m from the base
# axis (re-measured 2026-09-11; it was previously believed to be at 0.167 m, with
# the whole image centre inside the dead zone). Its image still extends ~0.4 m
# either side along base_link x at table height, so the robot-side edge of the
# view reaches inside the dead zone. Without this check objects there are
# detected, routed, queued, and only then fail during planning.
#
# EMPIRICAL, not derived. Pure forward kinematics says the UR3e can get to
# 0.066 m, but that ignores self-collision and the table; the real limit was
# found by jogging. Two measurements bracket it at table height:
#     r = 0.167 m   could NOT be reached (then believed to be under the camera)
#     r = 0.226 m   reached comfortably
# 0.20 sits between them. Raise it if tasks still fail during planning near the
# base; lower it if pickable objects are being skipped.
min_reach_radius_m: 0.20

# small vertical clearance added to the detected pick height (meters).
# Still 0, carried over from the UR16e cell. Retune against this cell's own depth
# error once the camera ROTATION is verified — until then the projected pick
# height is not trustworthy enough to calibrate an offset against.
pick_z_offset_m: 0.00

# if the vacuum sensor doesn't confirm a grasp (Step 5b), the single retry
# lowers the pick pose by this much (meters) before closing again.
grasp_retry_extra_depth_m: 0.01

# TCP orientation constraint applied to the carry transit moves (Steps 6 & 7)
# so a grasped object does not tip onto its side mid-transit. Per-axis tolerances
# are radians of allowed divergence from tool-down. ~3.14 = free, 0 = locked.
#
# Tolerances are tightened from the UR16e's 0.5 rad to 0.35 rad: the UR3e's
# shorter links mean a given wrist deviation tips the payload through a larger
# angle relative to the transit arc. If constrained OMPL planning becomes slow or
# starts failing, loosen these back toward 0.5 before disabling the constraint.
#
# Note: only OMPL planners honor this; Pilz PTP/LIN ignore it.
orientation_constraint:
  enabled: true
  link_name: "tool0"
  absolute_x_axis_tolerance: 0.35
  absolute_y_axis_tolerance: 0.35
  absolute_z_axis_tolerance: 3.14
  weight: 1.0
