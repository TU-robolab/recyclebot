# Work-cell collision geometry for the UR3e cell.
#
# MEASURED 2026-08-18 by touching each feature with the bare flange and reading
# the controller's TCP (PolyScope TCP offset is zero, so the reported pose is the
# flange face, and the flange frame origin sits on that face — the contact point
# is the reading, with nothing to subtract).
#
# All boxes are axis-aligned and expressed in the "world" frame, which coincides
# with base_link. NOTE: this is NOT the UR "base" frame used by
# sorting_sequence.yaml — base is base_link rotated 180 deg about Z, so x/y signs
# flip. Every number below has already been converted to base_link.
#
# Raw measurements, for anyone re-deriving these (base_link, metres):
#   table surface          [ 0.21961,  0.05386,  0.00196]
#   camera underside       [ 0.16646,  0.01297,  0.54795]   SUPERSEDED, see below
#   post, +Y face, low     [ 0.16893, -0.13821,  0.04223]
#   post, -X face, top     [ 0.15220, -0.17472,  0.60199]   x is 150 mm short
#
# CORRECTED 2026-09-11. The post and camera readings placed both 0.14-0.15 m too
# close to the robot in x. The camera was re-measured by the camera itself (see
# calibration.yaml): it sits at x = 0.307, not 0.166. The post's -X face reading
# is short by 0.150 — exactly the E-Pick's flange->tool0 length, as if the cup
# tip, not the bare flange, touched the post with the tool pointing +X. The
# corrected face at x = 0.302 puts the post centre at x = 0.322, which the depth
# image confirms independently (post back-projects to x ~ 0.32, directly under
# the camera, as a side photo of the cell also shows). The table reading is
# unaffected: the robot is bolted to that table, so z = 0.002 is right.
#
# size:     (x, y, z) full extents in meters
# position: (x, y, z) of the box CENTER in meters

# Mounting table: 640 mm (x) x 800 mm (y), robot centred on the long side.
#
# Orientation was ambiguous from the description alone ("465 mm from the front,
# 175 mm from the back"). It is resolved by the table touch point at x = +0.220:
# that only lies on the table if +X points toward the FRONT, giving
#   back edge  x = -0.175
#   front edge x = +0.465
# so the centre is at x = (-0.175 + 0.465) / 2 = +0.145.
#
# Top surface measured at z = +0.00196, i.e. the table top is level with the
# robot's own base mount. Thickness is not measured and does not matter for
# planning — only the top face does — so 50 mm is assumed and the centre placed
# to put the top at the measured height: 0.002 - 0.05/2 = -0.023.
table:
  size: [0.640, 0.800, 0.05]
  position: [0.145, 0.0, -0.023]

# Camera stand: 40 x 40 mm square post, axis-aligned with base_link.
#
# Centre solved from two touches on two DIFFERENT faces, each offset inward by
# half the 40 mm width:
#   +Y face at y = -0.13821            ->  centre y = -0.13821 - 0.020 = -0.1582
#   -X face at x = +0.15220 + 0.150    ->  centre x = +0.30220 + 0.020 = +0.3222
# The +0.150 is the E-Pick correction described at the top of this file. A shift
# common to both touches (tool pointing +X for both) leaves their relative
# geometry intact, which is why the original cross-check — each touch 3 mm and
# 17 mm off-centre along the other face — passed without catching it. The y
# value is unaffected by a +X shift and is kept; the depth image agrees with it
# to within its few-cm resolution.
#
# Runs from the table top (0.002) to the measured top (0.602): height 0.600,
# centre z = 0.302.
#
# Confirmed vertical by inspection (the two touches were on different faces and
# so could not have detected a lean themselves).
#
# This post is a real collision hazard, not a formality: it stands 0.60 m tall
# 0.36 m from the base axis, inside the arm's reachable envelope.
camera_stand:
  size: [0.04, 0.04, 0.600]
  position: [0.3222, -0.1582, 0.302]

# Box around the RealSense D415, its mount, and the support arm back to the post.
#
# RE-DERIVED 2026-09-11 against the corrected camera position. The earlier
# version assumed a bracket ABOVE a camera hanging at z = 0.548, below the top
# of its own post; in reality the camera sits on a ball-head mount on a plate
# across the top of the post, with its lens face at z = 0.644 (calibration.yaml).
# From the side, bottom to top:
#   thumbscrew knob under the plate   down to ~0.56
#   post top / plate                  ~0.60
#   ball head
#   camera lens face (camera_link)    0.644
#   camera back + cable plug          up to ~0.67
# so the box spans z 0.56 .. 0.68.
#
# The camera's long axis runs along X, not Y: the image width axis is base_link
# +X (verified by projecting the robot and post into the image), and the D415's
# long side faces a viewer looking along Y.
#
# ANCHORING: the box centre comes from calibration.yaml ->
# camera_transform.translation, so it can never drift from the TF the projection
# maths uses. Only `size` and `offset` are set here. `offset` shifts the box
# relative to camera_link because the mount and support arm are below and behind
# the optical body rather than around it.
#
# Deliberately coarse, like before: the whole volume between post and camera
# is somewhere the arm must never go, so one solid block loses nothing.
#
#   x: camera_link 0.307, offset 0.000, size 0.13  ->  spans 0.242 .. 0.372
#      covering the camera (0.257 .. 0.357) and the post (0.302 .. 0.342).
#   y: camera_link 0.058, offset -0.103, size 0.27 ->  spans -0.180 .. +0.090
#      from the post's far face (-0.178) to past the camera body (~0.07).
#   z: camera_link 0.630, offset -0.010, size 0.12 ->  spans 0.560 .. 0.680
#      (camera_link z is tuned 14 mm below the real lens face — see
#      calibration.yaml — so the offset compensates to keep the box on the real
#      hardware. Change the two together.)
camera:
  size: [0.13, 0.27, 0.12]
  offset: [0.0, -0.103, -0.010]

# The camera support arm is covered by the stretched camera box above rather than
# modelled on its own, which is why the schema still needs only three boxes.
