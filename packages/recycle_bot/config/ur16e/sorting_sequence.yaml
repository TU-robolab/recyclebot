# YAML defining sorting target locations and neutral pose
# defined as a conjunction of a position and orientation in reference to the UR
# "base" frame (the controller frame shown on the teach pendant — rec_bot_control
# publishes these poses with frame_id "base"):
# - position: cartesian coordinates (meters) - consistent with MoveIt
# - orientation: quaternion [x, y, z, w]
#
# NOTE: "base" is NOT "base_link"! On UR robots base = base_link rotated 180°
# about Z, so x/y signs flip between the two. Measure poses in "base" (e.g. via
# the teach pendant TCP display), or negate x/y if you measured in base_link.

# neutral pose: safe position above workspace for transit between pick and place
# robot moves here after gripping before moving to place location
neutral_pose:
  position: [-0.521, 0.474, 0.344]  # centered, elevated (meters)
  orientation: [0.691287034033189, 0.7225793866612643, -0.0010909763948931102, 0.000276261350695787]  # face-down (180° around Y)

# joint-space neutral (preferred for safe, deterministic motion)
neutral_joint_pose:
  shoulder_pan_joint: -2.91
  shoulder_lift_joint: -1.54
  elbow_joint: -2.28
  wrist_1_joint: -0.89
  wrist_2_joint: 1.57
  wrist_3_joint: -4.08

  # neutral_joint_pose:
  # shoulder_pan_joint: -1.92
  # shoulder_lift_joint: -1.82
  # elbow_joint: -1.91
  # wrist_1_joint: -0.96
  # wrist_2_joint: 1.57
  # wrist_3_joint: -3.19

# joint-space pose under the camera (waypoint before descending to pick)
under_camera_pose:
  shoulder_pan_joint: -3.40
  shoulder_lift_joint: -1.72
  elbow_joint: -2.22
  wrist_1_joint: -0.77
  wrist_2_joint: 1.57
  wrist_3_joint: -4.57

# named drop-off bins
# each bin is a position (meters) + orientation quaternion [x, y, z, w] in the
# UR "base" frame (see note at the top of this file)
bins:
  general_waste: { position: [0.425, -0.391, 0.487], orientation: [1.0, 0.0, 0.0, 0.0] }
  gelber_sack:          { position: [0.436, -0.055, 0.576], orientation: [0.707, 0.707, 0, 0] }
  glas_papier:         { position: [0.425, -0.391, 0.487], orientation: [1.0, 0.0, 0.0, 0.0] }
# TODO: replace the placeholder coordinates above with each bin's measured pose

# label-to-bin routing: maps a detected YOLO class label (from model.names) to a
# bin name defined under 'bins' above. Any label not listed here falls through
# to 'default_bin'.
#
# Rewritten for Minimuell.pt (9 classes). The previous routing was written for
# RecycleBotDIS3Obj_full.pt and shared none of these labels — under it, 7 of the
# 9 new classes fell silently through to general_waste.
#
# Grouped by German kerbside separation: the Gelber Sack takes plastics and metal
# packaging together, glass and paper are collected separately, and anything
# unrecognised is residual waste.
#
# LABELS ARE COPIED VERBATIM FROM model.names AND ARE NOT CONSISTENTLY SPELLED.
# Note that 'non-food_bottle_pet' uses a HYPHEN while 'non_food_can_metal' and
# 'non_food_packet_PE' use UNDERSCORES, and that PE is uppercase. Matching is
# exact string comparison, so 'correcting' any of these to a consistent style
# silently sends that class to default_bin with no error.
bin_routing:
  # --- Gelber Sack: plastics ---
  food_bottle_pet: gelber_sack
  non-food_bottle_pet: gelber_sack
  food_packet_pp: gelber_sack
  food_packet_ps: gelber_sack
  non_food_packet_PE: gelber_sack
  # --- Gelber Sack: metal packaging ---
  food_can_metal: gelber_sack
  non_food_can_metal: gelber_sack
  # --- glass and paper ---
  food_jar_glass: glas_papier
  food_packet_cardboard: glas_papier

# bin used for any detected label without a bin_routing entry
default_bin: general_waste

# legacy round-robin sequence (not read by the code anymore; kept for reference)
sorting_sequence:
  - target_bin_1: { position: [0.425, -0.391, 0.487], orientation: [1.0, 0.0, 0.0, 0.0] }

# Inner dead-zone radius (meters) from the base axis; 0.0 disables the check.
# Left disabled: the UR16e has a dead zone like any UR arm, but its camera sits
# far enough out that the field of view never covered it, so no bound has ever
# been measured on this cell. Measure before enabling — an invented value would
# silently discard pickable objects.
min_reach_radius_m: 0.0

approach_height_m: 0.05  # meters above pick/place for approach/retreat
place_transit_height_m: 0.05  # optional higher Step 7 fallback height; keep equal to approach height unless a taller above-bin waypoint is known to be reachable
place_yaw_candidates_deg: [90.0, -90.0, 180.0, 0.0]  # Step 7/8 may rotate wrist yaw while keeping the tool vertical, avoiding unreachable exact-quaternion place goals. 90 deg first: yaw=0 is consistently unreachable for the place pose, so trying it first wasted two planning attempts.
grasped_object_size: [0.05, 0.05, 0.05]  # meters (box attached to tool for planning)

# small vertical clearance added to the detected pick height (meters).
# the vision pipeline tends to report the object surface slightly too low (depth
# averaging over the bbox + calibration error), so the robot over-travels by ~1cm
# and squishes the object. This raises the pick pose to compensate.
# increase if it still presses too hard, decrease if it stops short of the object.
pick_z_offset_m: 0.00

# if the vacuum sensor doesn't confirm a grasp (Step 5b), the single retry
# lowers the pick pose by this much (meters) before closing again — the first
# attempt commonly misses by closing just above the object. Increase if
# retries still miss short; decrease if the retry risks hitting the table.
grasp_retry_extra_depth_m: 0.01

# TCP orientation constraint applied to the carry transit moves (Steps 6 & 7)
# so a grasped object does not tip onto its side mid-transit. Per-axis tolerances
# are radians of allowed divergence from tool-down. ~3.14 = free, 0 = locked.
# x/y are kept loose (~28 deg) on purpose: tight enough to stop the object tipping
# over, loose enough that constrained OMPL planning stays fast/reliable. z is free
# (the object may spin about the vertical — that does not tip it).
# Note: only OMPL planners honor this; Pilz PTP/LIN ignore it.
orientation_constraint:
  enabled: true
  link_name: "tool0"
  absolute_x_axis_tolerance: 0.5
  absolute_y_axis_tolerance: 0.5
  absolute_z_axis_tolerance: 3.14
  weight: 1.0
