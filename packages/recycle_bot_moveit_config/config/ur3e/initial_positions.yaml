# Default initial positions for ur3e's ros2_control mock system.
#
# These are the taught neutral_joint_pose from
# recycle_bot/config/ur3e/sorting_sequence.yaml, so a simulated run starts where
# a real run starts. Keep the two in step: if the neutral pose is re-taught,
# update this file too, otherwise every fake run begins by flying the arm across
# the cell from a pose it would never actually be in.
#
# Values are deliberately not rounded to the nearest right angle. UR joints range
# over +/-2 pi, so wrist_1 at 4.71239 (270 deg) is a distinct joint value from
# -1.57080 (-90 deg) even though the arm is in the same physical place.
initial_positions:
  shoulder_pan_joint: -1.57079
  shoulder_lift_joint: -1.57081
  elbow_joint: -1.57079
  wrist_1_joint: 4.71239
  wrist_2_joint: 1.57078
  wrist_3_joint: 1.61231
